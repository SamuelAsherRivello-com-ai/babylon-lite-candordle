name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript source coverage
        run: npm run check:typescript-source
      - name: Check strict TypeScript
        run: npm run typecheck
      - name: Test template
        run: npm test
      - name: Build template
        run: npm run build
      - name: Verify declared release version
        id: version
        shell: bash
        run: |
          version="$(cut -d= -f2 version.txt)"
          grep -Fq "\"version\": \"V $version\"" wordle-clone/public/changelog.json
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION"

